schema_version: 1

# Machine-readable data-source registry used by the publication-safety guard
# (scripts/check_publication_safety.py). The human-readable companion is
# DATA_SOURCES.md.
#
# redistribution_status values are CONSERVATIVE PROJECT CLASSIFICATIONS for
# engineering purposes. They are not legal conclusions and not legal advice.
#
#   permitted_with_attribution  The publisher's published reuse terms were
#                               reviewed and allow reproduction with source
#                               attribution. Values may appear in reviewed
#                               public fixtures.
#   restricted                  Commercial/proprietary publisher or
#                               distributor. Treated as non-redistributable:
#                               only metadata (names, identifiers, URLs,
#                               schedule facts) may be published.
#   unresolved                  Reuse terms not yet reviewed or unclear.
#                               Treated exactly like "restricted".
#   project_generated           Synthetic data created by this repository.

policy_note: >-
  The code licence of this repository does not license third-party data.
  Publicly accessible URLs do not by themselves grant redistribution rights.

sources:
  # --------------------------------------------------------------------------
  # Official sources reviewed as reusable with attribution
  # --------------------------------------------------------------------------
  - source_key: bls
    publisher: U.S. Bureau of Labor Statistics
    category: official_statistics
    url_patterns: [bls.gov]
    event_keys:
      - us_cpi
      - us_employment_situation
      - us_ppi
      - us_jolts_job_openings
      - us_employment_cost_index
    redistribution_status: permitted_with_attribution
    terms_url: https://www.bls.gov/opub/copyright-information.htm
    attribution: "Source: U.S. Bureau of Labor Statistics"
    modification_notice_required: false
    repository_treatment: >-
      Reviewed records may be published in data/demo/official_releases_allowlist.jsonl.

